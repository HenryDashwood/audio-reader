schemaVersion: 1

# Keep the MCP surface focused on day-to-day iOS development while allowing
# local agents to operate paired physical devices and the Simulator, and attach LLDB.
enabledWorkflows:
  - simulator
  - simulator-management
  - device
  - ui-automation
  - debugging

sentryDisabled: true
disableXcodeAutoSync: true
filePathRenderStyle: tree

sessionDefaults:
  projectPath: ios/Hearful.xcodeproj
  scheme: Hearful
  configuration: Debug
  simulatorName: iPhone 17
  simulatorPlatform: iOS Simulator
  # Match routine MCP runs to the Make targets' oldest compatible runtime.
  # Use `make ios-test-latest` for explicit coverage of the newest runtime.
  useLatestOS: false
  suppressWarnings: false
  derivedDataPath: build/DerivedData
  preferXcodebuild: true
  bundleId: com.henrydashwood.hearful
