name: iOS tests

# The complete suite on every supported iOS generation, shared by CI and
# TestFlight. It runs on the maintainer's Mac, registered as a self-hosted
# runner with the `magpie-ios` label: GitHub's xcode-27 image has no iOS 26
# simulator, and a freshly created one starved its three CPUs for 20-30
# minutes on first boot. The Mac keeps both simulators warm. Fork pull
# requests need the maintainer's approval before any workflow runs, because
# their code would run on that Mac.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  ios:
    name: iOS ${{ matrix.ios }} tests
    runs-on: [self-hosted, macOS, ARM64, magpie-ios]
    timeout-minutes: 60
    strategy:
      # Report both generations even when one fails.
      fail-fast: false
      matrix:
        include:
          - ios: '27'
            runtime: '27.0'
            target: ios-test
          - ios: '26'
            runtime: '26.5'
            target: ios-test-compatibility

    steps:
      - uses: actions/checkout@v7

      # DEVELOPER_DIR rather than `sudo xcode-select`: the self-hosted runner
      # has no password-less sudo, and must not change the Mac's own selection.
      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          xcode=""
          for candidate in /Applications/Xcode_27.0.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]] \
              && [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$candidate/Contents/Info.plist")" == "27.0" ]]; then
              xcode="$candidate"
              break
            fi
          done
          if [[ -z "$xcode" ]]; then
            echo "::error::The runner must provide released Xcode 27.0"
            exit 1
          fi
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
          echo "macos=$(sw_vers -buildVersion)" >> "$GITHUB_OUTPUT"

      - name: Install the released iOS ${{ matrix.runtime }} runtime
        run: bash scripts/prepare-ios-simulators.sh "${{ matrix.runtime }}"

      # Cache compiler outputs, not a previous test result or build database.
      # Xcode validates inputs on every build; the full suite always runs.
      # Each generation keeps its own cache because their builds differ.
      - name: Cache iOS compilations
        uses: actions/cache@v6
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ios-compilation-v2-ios${{ matrix.ios }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.macos }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('ios/**', 'scripts/ios-dev.sh', '.github/workflows/ios-tests.yml') }}
          restore-keys: |
            ios-compilation-v2-ios${{ matrix.ios }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.macos }}-${{ steps.xcode.outputs.build }}-

      - name: Verify the iOS toolchain
        run: make ios-doctor

      - name: Run the iOS ${{ matrix.ios }} tests
        env:
          IOS_COMPILATION_CACHE: '1'
          IOS_TEST_PREBOOT: '1'
        run: make ${{ matrix.target }}

      - name: Retain iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-diagnostics-${{ matrix.ios }}
          path: |
            build/ios-logs/
            build/DerivedData/Build/Intermediates.noindex/**/swbuild.tmp.*/Data.noindex/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
