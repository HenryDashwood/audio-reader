name: TestFlight

# Releases are deliberately not on every push to main. A build goes out when a
# `v*` tag is pushed, or when someone asks for one:
#
#     git tag v1.2.0 && git push origin v1.2.0
#     gh workflow run testflight.yml --ref main
#
# Distribution is a separate job from the build, so a build that uploaded fine
# but failed to distribute can be picked up again without rebuilding:
#
#     gh workflow run testflight.yml --ref main \
#       -f distribute_build=56 -f sync_version=1.3.0
#
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      distribute_build:
        description: >-
          Distribute an already-uploaded build number to the external testers
          instead of building a new one. Leave empty to build.
        required: false
        default: ""
      sync_version:
        description: >-
          App Store version to synchronise when distributing an existing build.
          Leave empty for an ordinary manual TestFlight build.
        required: false
        default: ""

# Two uploads racing each other would take the same build number.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: inputs.distribute_build == ''
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      build: ${{ steps.version.outputs.build }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, so the whole history matters.
          fetch-depth: 0

      - name: Validate the App Store listing
        run: python3 scripts/app_store_sync.py validate

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          # The deployment target is iOS 26, so anything older cannot build this.
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "::error::Need Xcode 26+ for the iOS 26 SDK, found $major in $xcode"
            exit 1
          fi

      - name: Run the iOS tests
        run: |
          set -euo pipefail
          # Runner images change which simulators they ship, so pick whatever
          # iPhone is actually present rather than naming one.
          device=$(xcrun simctl list devices available | sed -nE 's/^ +(iPhone [^(]*[^ (]) +\(.*/\1/p' | sort -uV | tail -1)
          if [ -z "$device" ]; then
            echo "::error::no iPhone simulator available on this runner"
            exit 1
          fi
          echo "Testing on $device"
          xcodebuild test \
            -project ios/Hearful.xcodeproj \
            -scheme Hearful \
            -destination "platform=iOS Simulator,OS=latest,name=$device"

      - name: Work out the version numbers
        id: version
        run: |
          set -euo pipefail
          # App Store Connect rejects a build number it has seen before. The
          # commit count is unique and always increasing, which the manual
          # CURRENT_PROJECT_VERSION bump in the project file is not.
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          # A v-tag sets the user-visible version. A manual run inherits the
          # highest release tag reachable from this commit, so a post-release
          # build cannot accidentally go backwards to the project's stale
          # MARKETING_VERSION and lose to an older build in TestFlight.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            marketing_version="${GITHUB_REF_NAME#v}"
          else
            release_tag=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')
            marketing_version="${release_tag#v}"
          fi

          if [ -n "$marketing_version" ]; then
            echo "marketing_arg=MARKETING_VERSION=$marketing_version" >> "$GITHUB_OUTPUT"
          else
            # Before the first release tag, fall back to the Xcode project.
            echo "marketing_arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -A -t cert -f pkcs12
          rm "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"

      - name: Install the provisioning profile
        id: profile
        env:
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          install_profile() {
            encoded="$1"
            stem="$2"
            output_name="$3"
            profile="$RUNNER_TEMP/$stem.mobileprovision"
            decoded="$RUNNER_TEMP/$stem.plist"

            echo "$encoded" | base64 --decode > "$profile"
            security cms -D -i "$profile" > "$decoded"
            uuid=$(plutil -extract UUID raw -o - "$decoded")
            name=$(plutil -extract Name raw -o - "$decoded")

            # Xcode 26 reads profiles from UserData; older Xcode used MobileDevice.
            # Install to both so the runner image version does not matter.
            for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                       "$HOME/Library/MobileDevice/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$profile" "$dir/$uuid.mobileprovision"
            done

            echo "$output_name=$uuid" >> "$GITHUB_OUTPUT"
            echo "Installed '$name' ($uuid)"
          }

          install_profile "$PROFILE_B64" app app_uuid

      - name: Archive
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          MARKETING_ARG: ${{ steps.version.outputs.marketing_arg }}
          APP_PROFILE_UUID: ${{ steps.profile.outputs.app_uuid }}
        run: |
          set -euo pipefail
          # Signed manually against the profile installed above. No
          # -allowProvisioningUpdates and no API key here on purpose: given
          # those, Xcode invents an "Apple Development: Created via API"
          # certificate and archives with that instead of the distribution one.
          # MARKETING_ARG is unquoted on purpose: empty means "no override".
          xcodebuild archive \
            -project ios/Hearful.xcodeproj \
            -scheme Hearful \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hearful.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            HEARFUL_APP_PROFILE_UUID="$APP_PROFILE_UUID" \
            DEVELOPMENT_TEAM=67F2439F4X \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            $MARKETING_ARG

      - name: Verify voice models are not bundled
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Hearful.xcarchive/Products/Applications/Magpie.app"
          bundled=$(find "$app" -type f \( \
            -name '*.onnx' -o \
            -name '*.safetensors' -o \
            -name 'weight.bin' \
          \) -print)
          if [ -n "$bundled" ]; then
            echo "::error::on-device speech-model files were embedded in Magpie.app"
            echo "$bundled"
            exit 1
          fi

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_PROFILE_UUID: ${{ steps.profile.outputs.app_uuid }}
        run: |
          set -euo pipefail
          # Apple's /usr/bin/rsync (openrsync) reads -E as --extended-attributes,
          # upstream rsync reads it as --executability. Xcode's IPA step calls
          # the Apple one, which spawns a helper found on PATH; if Homebrew's
          # rsync answers, it rejects the flag and export dies with "Copy
          # failed". Putting the system tools first keeps both ends Apple's.
          export PATH="/usr/bin:$PATH"

          # Point the export at the profile by UUID, so renaming it in the
          # developer portal cannot break the build.
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/ExportOptions.plist "$options"
          plutil -replace 'provisioningProfiles.com\.henrydashwood\.hearful' \
            -string "$APP_PROFILE_UUID" "$options"

          # The key still authenticates the upload; it is only provisioning that
          # must not go through it.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hearful.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcarchive-logs
          path: |
            ${{ runner.temp }}/Hearful.xcarchive/Info.plist
          if-no-files-found: ignore

  # Separate job, and on Linux: this is only HTTP calls, and most of its time is
  # spent waiting for Apple to finish processing the build. Holding a macOS
  # runner idle for twenty minutes to do that would be wasteful.
  distribute:
    needs: testflight
    # `skipped` is the distribute-an-existing-build case, where the build job
    # never ran. Without always() the whole job would be skipped with it.
    if: always() && contains(fromJSON('["success", "skipped"]'), needs.testflight.result)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: this action publishes moving major tags only up to v7,
      # so `@v10` does not resolve even though v10.0.1 is the current release.
      - uses: astral-sh/setup-uv@v10.0.1

      # The individual key and the review contact are optional. With the
      # individual key, submissions show under a person's name in App Store
      # Connect rather than as "API user"; with the contact, the private
      # review notes are written too, instead of being pasted by hand.
      - name: Sync the public App Store listing
        if: github.ref_type == 'tag' || inputs.sync_version != ''
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          ASC_INDIVIDUAL_KEY_ID: ${{ secrets.APP_STORE_CONNECT_INDIVIDUAL_KEY_ID }}
          ASC_INDIVIDUAL_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_INDIVIDUAL_KEY_P8 }}
          ASC_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_FIRST_NAME }}
          ASC_REVIEW_CONTACT_LAST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_LAST_NAME }}
          ASC_REVIEW_CONTACT_EMAIL: ${{ secrets.ASC_REVIEW_CONTACT_EMAIL }}
          ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
          SYNC_VERSION: ${{ inputs.sync_version }}
        run: |
          set -euo pipefail
          version="$SYNC_VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          args=(--version "$version")
          if [ -n "$ASC_REVIEW_CONTACT_PHONE" ]; then
            args+=(--review-notes)
          fi
          uv run scripts/app_store_sync.py sync "${args[@]}"

      - name: Set release notes and distribute
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          ASC_INDIVIDUAL_KEY_ID: ${{ secrets.APP_STORE_CONNECT_INDIVIDUAL_KEY_ID }}
          ASC_INDIVIDUAL_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_INDIVIDUAL_KEY_P8 }}
          BUILD_NUMBER: ${{ needs.testflight.outputs.build }}
          DISTRIBUTE_BUILD: ${{ inputs.distribute_build }}
        run: |
          set -euo pipefail
          build="${DISTRIBUTE_BUILD:-$BUILD_NUMBER}"
          if [ -z "$build" ]; then
            echo "::error::no build number to distribute"
            exit 1
          fi
          args=(--build-number "$build" --changelog docs/CHANGELOG.md)

          # Only a tag, or an explicit request for an existing build, reaches
          # real testers. A plain manual run still gets its release notes, so the
          # build is legible in App Store Connect, but stays with the internal
          # group.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            args+=(--expect-version "${GITHUB_REF_NAME#v}")
            args+=(--external-group "Friends and Family")
          elif [ -n "$DISTRIBUTE_BUILD" ]; then
            args+=(--external-group "Friends and Family")
          fi

          uv run scripts/testflight_distribute.py "${args[@]}"

      # App-level and idempotent, so every distributed build keeps the
      # TestFlight invitation text and Beta App Review record in step with
      # the repository.
      - name: Sync the TestFlight test information
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          ASC_INDIVIDUAL_KEY_ID: ${{ secrets.APP_STORE_CONNECT_INDIVIDUAL_KEY_ID }}
          ASC_INDIVIDUAL_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_INDIVIDUAL_KEY_P8 }}
          ASC_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_FIRST_NAME }}
          ASC_REVIEW_CONTACT_LAST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_LAST_NAME }}
          ASC_REVIEW_CONTACT_EMAIL: ${{ secrets.ASC_REVIEW_CONTACT_EMAIL }}
          ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$ASC_REVIEW_CONTACT_PHONE" ]; then
            args+=(--review-notes)
          fi
          uv run scripts/app_store_sync.py testflight "${args[@]}"
