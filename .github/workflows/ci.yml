name: CI

# GitHub Actions owns automatic pull-request and main-branch validation.
# Xcode Cloud's Test workflow is manual-only to avoid duplicate iOS runs.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A cancelled workflow cannot cancel a Railway deployment already submitted.
  # Serialize main runs so an older build cannot finish after a newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Each platform job runs only when its own inputs changed. Jobs are skipped
  # with `if:` rather than a workflow-level `paths:` filter so that a skipped
  # check still reports a result and the staging job's `needs` resolve.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      compatibility: ${{ steps.filter.outputs.compatibility }}
      deploy: ${{ steps.filter.outputs.deploy }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      # On pushes to main this compares against the commit before the push, so
      # a multi-commit push is judged on all of its changes.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - 'Makefile'
            android:
              - *shared
              - 'android/**'
              - 'scripts/android-dev.sh'
            # The backend job also runs the repository-script tests and the
            # App Store listing validation; its tests read the frozen client
            # checksums, the deploy config and the iOS browser-capture fixtures.
            backend:
              - *shared
              - 'backend/**'
              - 'scripts/**'
              - 'compatibility/**'
              - 'app-store/**'
              - 'deploy/**'
              - 'ios/HearfulTests/BrowserCaptureFixtures/**'
            compatibility:
              - *shared
              - 'backend/**'
              - 'compatibility/**'
              - 'scripts/check_backend_compatibility.py'
            # What ships to Railway. Only these changes produce a new staging candidate.
            deploy:
              - 'backend/**'
              - 'deploy/**'
            ios:
              - *shared
              - 'ios/**'
              - 'app-store/**'
              - 'scripts/ios-dev.sh'
              - 'scripts/prepare-ios-simulators.sh'

  android:
    name: Android checks
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Cache Android dependencies
        uses: actions/cache@v6
        with:
          path: build/android-gradle
          key: android-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/gradle-daemon-jvm.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Build, unit tests, and lint
        run: make android-check
      - name: Retain Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run backend checks
        run: make backend-check

      - name: Validate the App Store listing
        run: make app-store-validate

  ios:
    name: iOS tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # macos-latest still ships Xcode 26; request the Xcode 27 image explicitly.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          xcode=/Applications/Xcode_27.0.app
          if [[ ! -d "$xcode" ]]; then
            echo "::error::The runner must provide released Xcode 27.0 at $xcode"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
          echo "macos=$(sw_vers -buildVersion)" >> "$GITHUB_OUTPUT"

      - name: Install released simulator runtimes
        id: simulators
        run: bash scripts/prepare-ios-simulators.sh

      # Cache compiler outputs, not a previous test result or build database.
      # Xcode validates inputs on every build; the full suite always runs.
      - name: Cache iOS compilations
        uses: actions/cache@v6
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ios-compilation-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.macos }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('ios/**', 'scripts/ios-dev.sh', '.github/workflows/ci.yml') }}
          restore-keys: |
            ios-compilation-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.macos }}-${{ steps.xcode.outputs.build }}-

      - name: Verify the iOS toolchain
        run: make ios-doctor

      - name: Run the iOS 27 tests
        env:
          IOS_COMPILATION_CACHE: '1'
          IOS_TEST_PREBOOT: '1'
        run: make ios-test

      # Hosted macOS runners are small. With the iOS 27 simulator still
      # booted, the freshly created iOS 26 one has taken over six minutes to
      # launch WebKit's processes, stalling every web-view test.
      - name: Shut down the iOS 27 simulator
        if: ${{ !cancelled() && steps.simulators.outcome == 'success' }}
        run: |
          echo "CPUs: $(sysctl -n hw.ncpu), memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          memory_pressure -Q || true
          xcrun simctl shutdown all
          memory_pressure -Q || true

      - name: Run the iOS 26 compatibility tests
        if: ${{ !cancelled() && steps.simulators.outcome == 'success' }}
        env:
          IOS_COMPILATION_CACHE: '1'
          IOS_TEST_PREBOOT: '1'
        run: make ios-test-compatibility

      - name: Retain iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-diagnostics
          path: |
            build/ios-logs/
            build/DerivedData/Build/Intermediates.noindex/**/swbuild.tmp.*/Data.noindex/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    name: Released iOS client compatibility
    needs: changes
    if: needs.changes.outputs.compatibility == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Install frozen backend dependencies
        run: cd backend && uv sync --frozen
      - name: Test current backend with the frozen released client
        run: make backend-compatibility

  staging:
    name: Deploy backend to staging
    needs: [changes, backend, ios, compatibility]
    # A backend deploy always has passing backend and compatibility checks.
    # iOS tests gate it when they ran, and are skipped when the app is unchanged.
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.deploy == 'true'
      && needs.backend.result == 'success'
      && needs.compatibility.result == 'success'
      && (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: backend-staging
      url: https://audio-reader-staging.up.railway.app
    concurrency:
      group: backend-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Deploy and verify this exact commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/deploy_backend.py deploy --environment staging --sha "$DEPLOY_SHA"
