name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run backend checks
        run: make backend-check

  ios:
    name: iOS tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Verify the iOS toolchain
        run: make ios-doctor

      - name: Validate the App Store listing
        run: make app-store-validate

      - name: Run the iOS tests
        run: make ios-test
