# Lives in backend/ because the Railway service's root directory is backend —
# the repo also contains the iOS app, which is not part of this service.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Migrations run before uvicorn binds, so a deploy is not healthy the instant
# the container starts. The timeout covers that, plus a slow first connection.
healthcheckPath = "/health"
healthcheckTimeout = 120
