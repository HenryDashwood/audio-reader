[project]
name = "audioreader"
version = "0.1.0"
description = "Backend API for the voice-controlled podcast and RSS reader"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "feedparser>=6.0.11",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.120.2",
    "pyjwt[crypto]>=2.9",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "respx>=0.22",
    "ruff>=0.8",
    "ty>=0.0.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audioreader"]

[tool.ty.environment]
python = "./.venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# So tests can import `evals`, which is a development tool rather than part of
# the shipped package. The eval corpus itself is never collected: it calls a
# real model and costs real money.
pythonpath = ["."]

[tool.ruff]
line-length = 119
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `evals` lives beside the package rather than inside it, so say so explicitly
# instead of putting the repo root on ruff's src path — that would also sweep
# `alembic` in and reshuffle every migration.
known-first-party = ["evals"]
